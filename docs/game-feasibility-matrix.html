<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blend65 — C64 Game Feasibility Matrix</title>
<style>
*{box-sizing:border-box}
:root{
  color-scheme:light;
  --surface:#fcfcfb;--plane:#f9f9f7;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);--accent:#2a78d6;
  --good:#0ca30c;--warning:#fab219;--critical:#d03b3b;
  --good-bg:rgba(12,163,12,.12);--warning-bg:rgba(250,178,25,.18);--critical-bg:rgba(208,59,59,.12);
  --chip:rgba(11,11,11,.05);--chip-on:#2a78d6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --surface:#1a1a19;--plane:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.12);--accent:#3987e5;
  --good-bg:rgba(12,163,12,.20);--warning-bg:rgba(250,178,25,.16);--critical-bg:rgba(208,59,59,.22);
  --chip:rgba(255,255,255,.07);--chip-on:#3987e5;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface:#1a1a19;--plane:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.12);--accent:#3987e5;
  --good-bg:rgba(12,163,12,.20);--warning-bg:rgba(250,178,25,.16);--critical-bg:rgba(208,59,59,.22);
  --chip:rgba(255,255,255,.07);--chip-on:#3987e5;
}
html,body{margin:0}
body{background:var(--plane);color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:24px;max-width:1180px;margin:0 auto;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
h1{font-size:1.5rem;margin:0 0 2px}
h2{font-size:1.05rem;margin:28px 0 10px;letter-spacing:.01em}
p{margin:.5em 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;
  background:var(--chip);padding:.05em .35em;border-radius:4px}
.sub{color:var(--ink2);font-size:.9rem;margin:0 0 4px}
.purpose{color:var(--ink2);max-width:78ch}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.themebtn{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:7px 11px;cursor:pointer;font-size:.85rem}
.themebtn:hover{border-color:var(--accent)}

/* summary bars */
.bars{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.bar-lab{font-weight:600;font-size:.9rem}
.bar{display:flex;height:26px;gap:2px;border-radius:6px;overflow:hidden}
.seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.78rem;
  font-weight:650;min-width:2px;font-variant-numeric:tabular-nums}
.seg.good{background:var(--good)}.seg.warning{background:var(--warning);color:#3a2a00}
.seg.critical{background:var(--critical)}
.legend-row{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--ink2)}
.legend-row b{font-weight:650;color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dot.good{background:var(--good)}.dot.warning{background:var(--warning)}.dot.critical{background:var(--critical)}

/* capability status board */
.board{display:grid;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:16px 18px}
.tiergroup{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.tiername{font-weight:650;font-size:.85rem;white-space:nowrap}
.tiername small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.capchips{display:flex;gap:7px;flex-wrap:wrap}
.capchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
  background:var(--chip);border-radius:999px;padding:4px 6px 4px 11px;font-size:.82rem;
  font-weight:600;cursor:pointer;color:var(--ink)}
.capchip:hover{border-color:var(--accent)}
.capchip.on{background:var(--chip-on);color:#fff;border-color:transparent}
.capchip .n{font-variant-numeric:tabular-nums;font-size:.72rem;background:rgba(0,0,0,.12);
  border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.capchip.on .n{background:rgba(255,255,255,.25)}
.capchip.t-available{cursor:default;opacity:.85}
.capchip.t-available:hover{border-color:var(--border)}
.tdot{width:9px;height:9px;border-radius:50%;flex:none}
.tdot.good{background:var(--good)}.tdot.warning{background:var(--warning)}.tdot.critical{background:var(--critical)}

/* controls */
.controls{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
.controls input[type=search],.controls select{
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:8px 10px;font:inherit;font-size:.88rem}
.controls input[type=search]{min-width:220px}
.chip{border:1px solid var(--border);background:var(--chip);color:var(--ink);
  border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.82rem;font-weight:600;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.v.on.good{background:var(--good);color:#fff;border-color:transparent}
.chip.v.on.warning{background:var(--warning);color:#3a2a00;border-color:transparent}
.chip.v.on.critical{background:var(--critical);color:#fff;border-color:transparent}
.reset{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:.84rem}
.count{color:var(--ink2);font-size:.85rem;margin-left:auto;font-variant-numeric:tabular-nums}
.filtlabel{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
thead th{position:sticky;top:0;background:var(--surface);z-index:1;text-align:left;
  border-bottom:2px solid var(--axis);white-space:nowrap;padding:0}
thead th button{width:100%;text-align:left;background:none;border:0;color:var(--ink2);
  font:inherit;font-weight:650;padding:11px 12px;cursor:pointer;white-space:nowrap}
thead th button:hover{color:var(--ink)}
thead th .arw{color:var(--accent);font-size:.72rem}
th.c,td.c{text-align:center}
tbody td{border-bottom:1px solid var(--grid);padding:9px 12px;vertical-align:top}
tbody tr:hover td{background:var(--chip)}
td.num{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;padding-right:14px}
.gtitle{font-weight:650}
.gmeta{color:var(--muted);font-weight:400;font-size:.82rem}
.arch{color:var(--ink2)}
.verd{white-space:nowrap;font-weight:650;border-radius:6px;padding:3px 9px;display:inline-block}
.verd.good{background:var(--good-bg)}.verd.warning{background:var(--warning-bg)}
.verd.critical{background:var(--critical-bg)}
.needchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);
  border-radius:6px;background:var(--chip);padding:2px 8px;margin:1px 3px 1px 0;font-size:.78rem;
  font-weight:600;cursor:pointer}
.needchip:hover{border-color:var(--accent)}
.needchip.on{background:var(--chip-on);color:#fff;border-color:transparent}
.needchip .tdot{width:7px;height:7px}
.dash{color:var(--muted)}
.diff{font-weight:650;font-variant-numeric:tabular-nums}
.conf{white-space:nowrap;color:var(--ink2);font-size:.82rem}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.cdot.known{background:var(--good)}.cdot.inferred{background:var(--warning)}.cdot.low{background:var(--critical)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.needchip.static,.capchip.static{cursor:default}
.needchip.static:hover,.capchip.static:hover{border-color:var(--border)}

/* non-game software table */
.softnote td{border-bottom:1px solid var(--grid);padding:0 12px 11px;color:var(--ink2);font-size:.83rem;
  line-height:1.5;max-width:70ch}
tbody tr.softhead td{border-bottom:0;padding-bottom:5px}
.softsum{color:var(--ink2);font-size:.86rem;margin:0 0 10px}

/* collapsibles + reference tables */
details{border:1px solid var(--border);border-radius:10px;background:var(--surface);
  padding:2px 16px;margin:10px 0}
details[open]{padding-bottom:14px}
summary{cursor:pointer;font-weight:650;padding:12px 0;color:var(--ink)}
summary:hover{color:var(--accent)}
.ref{border-collapse:collapse;width:100%;font-size:.85rem;margin-top:4px}
.ref th,.ref td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
.ref th{color:var(--ink2);font-weight:650}
ul.notes{margin:.3em 0;padding-left:1.15em}
ul.notes li{margin:.4em 0}
.foot{color:var(--muted);font-size:.82rem;margin:26px 0 8px;font-style:italic}
@media (max-width:640px){body{padding:14px}.count{margin-left:0;width:100%}
  .tiergroup{grid-template-columns:1fr}}
</style>
</head>

<script id="matrix-data" type="application/json">{"_readme":"SOURCE OF TRUTH for the C64 game feasibility matrix. Edit this file, then run `node scripts/gen-capability-matrix.mjs` (or `yarn gen:matrix`) to regenerate docs/game-feasibility-matrix.html. Each game lists the capabilities it `needs` (ids from `capabilities`); a game with an empty `needs` is buildable Now. The Buildable verdict (Now/Soon/Blocked), the summary tallies, and the per-capability unlock counts are all DERIVED by the generator from `needs` + each capability `tier` — never stored here. Confidence keys: known|inferred|low. Diff: S|M|L|XL. `software` is an optional second list of non-game entries — same row shape (plus an optional `note`), same rubric, numbered from 1 independently, and deliberately EXCLUDED from the game tallies and unlock counts.","meta":{"title":"Blend65 — C64 Game Feasibility Matrix","lastUpdated":"2026-07-19","refreshWith":"/update_capability"},"intro":{"purpose":["A capability-grounded assessment of whether 100 well-known Commodore 64 games could be built **faithfully** with the Blend65 toolchain. Every game is judged by the **capabilities it needs** — compiler, an optimizer for speed, sound, input, disk access, math — and which of those exist today. A game is buildable **Now** when every capability it needs already ships, **Soon** when it only waits on a *planned* capability, and **Blocked** when it needs one that *isn’t planned*.","**No sugarcoating.** A game is only **Now** if it can be built as the original *played* — right engine, right controls, clean in-language audio, no missing essentials, and no dropping to hand-poked machine-code bytes. A reduced-scope demake is not \"Now\"."]},"capabilities":[{"id":"compiler","name":"Compiler & language","tier":"available","blurb":"The frozen v3 language compiles end-to-end to 6502 (RD-18 complete). Every game needs it; none is blocked on it any more."},{"id":"optimizer","name":"Optimizer (speed)","tier":"planned","blurb":"A cycle-budget optimizer. Unlocks smooth per-frame scrolling and sprite multiplexing (>8 sprites) within the frame budget."},{"id":"sound-music","name":"Sound — music & SFX","tier":"available","blurb":"SID music and effects, written in-language and poked to the sound registers each frame."},{"id":"sound-sampled","name":"Sound — sampled speech","tier":"planned","blurb":"Digitized speech / sample playback with tight timing. Doable in-language; an effort, not a language gap."},{"id":"joystick","name":"Joystick / input","tier":"available","blurb":"Reading the joysticks and keyboard via the CIA ports with `peek`."},{"id":"disk-io","name":"Disk file I/O","tier":"unplanned","blurb":"Reading and writing files through the KERNAL — open/read/write/close, sequential and relative records. The mundane half of disk access: what any application needs to save a document. No KERNAL-call story exists yet."},{"id":"disk-streaming","name":"Disk streaming / multi-load","tier":"unplanned","blurb":"Multi-load, overlays, and data sets larger than 64 KB — levels, rooms and world maps pulled in as the program runs. The expensive half of disk access, and what the disk-era game catalogue is blocked on."},{"id":"math","name":"Math (fixed-point / float)","tier":"planned","blurb":"Fractional math. No floating point in the language; a fixed-point library would make hand-rolled physics clean."},{"id":"asm","name":"Hand-tuned asm","tier":"unplanned","blurb":"Linking cycle-exact hand-written assembly for 50 fps showcases and real-time 3D. Deferred, unscheduled."},{"id":"indirect-calls","name":"Indirect calls / dispatch","tier":"unplanned","blurb":"Function pointers, jump tables, VM-style dispatch (SCUMM engines, calling a ripped `.sid` player). Deferred, unscheduled."},{"id":"firmware","name":"Firmware / foreign-CPU code","tier":"unplanned","blurb":"Building something other than a plain RAM program: cartridge and KERNAL ROM images, and 6502 code assembled to run on the disk drive's own CPU. Needed by fastloaders, freezer cartridges, copiers and any ROM replacement."}],"tiers":[{"id":"available","label":"Available now","glyph":"✅","status":"good"},{"id":"planned","label":"Planned","glyph":"🟡","status":"warning"},{"id":"unplanned","label":"Not planned","glyph":"❌","status":"critical"}],"verdicts":[{"id":"now","label":"Now","glyph":"✅","status":"good","desc":"every capability it needs ships today"},{"id":"soon","label":"Soon","glyph":"🟡","status":"warning","desc":"only waiting on planned capabilities"},{"id":"blocked","label":"Blocked","glyph":"❌","status":"critical","desc":"needs a capability that isn’t planned"}],"scales":{"confidence":[{"key":"known","glyph":"✅","label":"internals known"},{"key":"inferred","glyph":"⚠️","label":"inferred from archetype"},{"key":"low","glyph":"🔴","label":"low"}],"diff":["S","M","L","XL"]},"howToRead":["**Buildable?** rolls up the capabilities a game needs: **✅ Now** — all of them ship today · **🟡 Soon** — the only ones missing are *planned* · **❌ Blocked** — it needs a capability that *isn’t planned*.","**Needs** lists the missing capabilities, most-blocking first. A **Now** game needs nothing it doesn’t already have (shown as `—`).","**The capability status board** above is the lever: ship one capability and *every* game waiting on it moves. The unlock counts show how many.","**Difficulty** (S/M/L/XL) is implementation effort, independent of buildability. **Confidence** — ✅ internals known · ⚠️ inferred from archetype · 🔴 low.","**Faithfulness bar is strict**: \"Now\" means the original *as played* — not a reduced-scope demake that drops the smooth scroll, the disk content, or the exact soundtrack."],"notes":["**Original-soundtrack footnote.** In-language SID music and effects are clean (*Sound — music & SFX*, available now). Reproducing a *ripped* `.sid` tune byte-for-byte means calling its own machine-code player routine, which needs **Indirect calls** — so a byte-faithful ripped soundtrack carries an implicit indirect-calls dependency. It is not added to every row."],"summaryNote":"The **Blocked** titles all need a capability that isn’t planned — **disk streaming** (the disk RPGs, SCUMM adventures, Cinemaware, Epyx multi-event sports, the streamed Last Ninjas), **hand-tuned asm** (real-time 3D and the 50 fps showcases: Elite, Out Run, Mayhem in Monsterland), or **indirect calls** (SCUMM dispatch). No optimizer reaches them — they need a new capability, not faster code. See the unlock table at the bottom.","games":[{"n":1,"title":"Pac-Man","year":82,"publisher":"Atarisoft","category":"Maze","archetype":"single-screen maze","needs":[],"diff":"S","conf":"known"},{"n":2,"title":"Ms. Pac-Man","year":83,"publisher":"Atarisoft","category":"Maze","archetype":"single-screen maze","needs":[],"diff":"S","conf":"known"},{"n":3,"title":"Dig Dug","year":83,"publisher":"Atarisoft","category":"Maze","archetype":"single-screen dig","needs":[],"diff":"S","conf":"known"},{"n":4,"title":"Frogger","year":83,"publisher":"Sierra","category":"Action","archetype":"single-screen lanes","needs":[],"diff":"S","conf":"known"},{"n":5,"title":"Q*bert","year":83,"publisher":"Parker","category":"Action","archetype":"iso single-screen","needs":[],"diff":"M","conf":"known"},{"n":6,"title":"Donkey Kong","year":83,"publisher":"Atarisoft","category":"Platform","archetype":"single-screen platform","needs":[],"diff":"M","conf":"known"},{"n":7,"title":"Space Invaders","year":81,"publisher":null,"category":"Shooter","archetype":"single-screen fixed","needs":[],"diff":"S","conf":"known"},{"n":8,"title":"Galaga","year":84,"publisher":null,"category":"Shooter","archetype":"single-screen fixed","needs":[],"diff":"M","conf":"known"},{"n":9,"title":"Bomb Jack","year":86,"publisher":"Elite","category":"Platform","archetype":"single-screen platform","needs":[],"diff":"M","conf":"known"},{"n":10,"title":"Bubble Bobble","year":87,"publisher":"Firebird","category":"Platform","archetype":"single-screen (2P)","needs":["optimizer"],"diff":"L","conf":"known"},{"n":11,"title":"Bruce Lee","year":84,"publisher":"Datasoft","category":"Platform","archetype":"flip-screen platform","needs":[],"diff":"M","conf":"known"},{"n":12,"title":"Manic Miner","year":83,"publisher":"Software Projects","category":"Platform","archetype":"flip-screen platform","needs":[],"diff":"M","conf":"known"},{"n":13,"title":"Jet Set Willy","year":84,"publisher":"Software Projects","category":"Platform","archetype":"flip-screen platform","needs":[],"diff":"M","conf":"known"},{"n":14,"title":"Impossible Mission","year":84,"publisher":"Epyx","category":"Platform","archetype":"flip-screen platform","needs":["sound-sampled"],"diff":"L","conf":"known"},{"n":15,"title":"Impossible Mission II","year":88,"publisher":"Epyx","category":"Platform","archetype":"flip-screen multi-zone","needs":["sound-sampled"],"diff":"L","conf":"inferred"},{"n":16,"title":"Lode Runner","year":83,"publisher":"Broderbund","category":"Puzzle","archetype":"single-screen platform","needs":[],"diff":"M","conf":"known"},{"n":17,"title":"Jumpman","year":83,"publisher":"Epyx","category":"Platform","archetype":"single-screen platform","needs":[],"diff":"M","conf":"known"},{"n":18,"title":"Monty on the Run","year":85,"publisher":"Gremlin","category":"Platform","archetype":"scroll platform","needs":["optimizer"],"diff":"M","conf":"inferred"},{"n":19,"title":"Ghosts 'n Goblins","year":86,"publisher":"Elite","category":"Platform","archetype":"hscroll run-and-gun","needs":["optimizer"],"diff":"L","conf":"known"},{"n":20,"title":"Giana Sisters","year":87,"publisher":"Rainbow Arts","category":"Platform","archetype":"smooth hscroll","needs":["optimizer"],"diff":"L","conf":"known"},{"n":21,"title":"Turrican","year":90,"publisher":"Rainbow Arts","category":"Platform","archetype":"multiscroll run-and-gun","needs":["optimizer","asm"],"diff":"XL","conf":"known"},{"n":22,"title":"Turrican II","year":91,"publisher":"Rainbow Arts","category":"Platform","archetype":"multiscroll run-and-gun","needs" ":"XL","conf":"known"},{"n":94,"title":"Mercenary","year":86,"publisher":"Novagen","category":"Sim/3D","archetype":"filled-vector 3D world","needs":["math","asm"],"diff":"XL","conf":"inferred"},{"n":95,"title":"M.U.L.E.","year":83,"publisher":"EA","category":"Strategy","archetype":"board + real-time auction","needs":[],"diff":"M","conf":"known"},{"n":96,"title":"Archon","year":83,"publisher":"EA","category":"Strategy","archetype":"board + arcade combat","needs":[],"diff":"L","conf":"inferred"},{"n":97,"title":"Laser Squad","year":88,"publisher":"Blade","category":"Strategy","archetype":"turn-based tactics","needs":[],"diff":"L","conf":"inferred"},{"n":98,"title":"Sim City","year":89,"publisher":"Maxis","category":"Sim","archetype":"city simulation","needs":["disk-io"],"diff":"L","conf":"inferred"},{"n":99,"title":"Lords of Midnight","year":84,"publisher":"Beyond","category":"Strategy","archetype":"strategy + vector views","needs":["disk-io"],"diff":"L","conf":"inferred"},{"n":100,"title":"Little Computer People","year":85,"publisher":"Activision","category":"Sim","archetype":"single-house sim","needs":[],"diff":"M","conf":"inferred"}],"softwareIntro":{"title":"Non-game software","blurb":["The same capability model applied to 40 pieces of C64 software that aren’t games — operating systems, development tools, terminals, office software, art packages and firmware. Same rubric, same capability tiers, but these rows are **kept out of the 100-title tallies, the summary bars, and the unlock counts above**: those numbers are about the game list and stay that way.","**What this section is really for.** Read down the Needs column and one capability appears again and again — *Disk file I/O*. Not streaming, not overlays; just opening a file and writing it back. It is the difference between a word processor and a text editor you can’t save from, and it is why almost everything here is Blocked. The game list can’t show you that, because a game that fits in RAM simply loads once and never asks again.","Desktop environments and operating systems are the sharpest cases, because they lean on the two capabilities the game catalogue is most often blocked on — **loading things off disk** and **calling through a pointer** — for the same underlying reason: an operating system is a thing that runs code it didn’t know about when it was built."]},"software":[{"n":1,"title":"GEOS 1.3 / 2.0","year":1986,"publisher":"Berkeley Softworks","category":"OS / desktop","archetype":"vectored WIMP OS, disk-loaded apps, turbo loader","note":"The desktop the C64 actually had. Its kernal is reached through a jump table and an application *is* a set of function pointers — icon tables, menu trees and the event vectors the main loop dispatches through — so indirect dispatch is the programming model, not an implementation detail. Applications, fonts and desk accessories stream off disk through GEOS's own VLIR file system. Its turbo loader uploads 6502 code into the 1541's own CPU and then bit-bangs the serial lines on cycle-exact timing: **foreign-CPU code and hand-tuned asm, in one feature**.","needs":["disk-streaming","indirect-calls","asm","firmware","optimizer"],"diff":"XL","conf":"known"},{"n":2,"title":"Contiki 1.x (C64 port)","year":2003,"publisher":"Adam Dunkels","category":"OS / desktop","archetype":"event-driven multitasking GUI + TCP/IP stack","note":"A windowed multitasking desktop with a TCP/IP stack, web browser, telnet and VNC client — on a stock C64. Open source, so the needs here are read rather than guessed: every process is a struct holding a function pointer, applications load from disk as separate binaries, and the whole thing is a lesson in how far the machine goes when the software is good.","needs":["indirect-calls","disk-streaming","optimizer"],"diff":"XL","conf":"known"},{"n":3,"title":"C64 OS","year":2022,"publisher":"Greg Nacu","category":"OS / desktop","archetype":"event-driven OS, disk-based apps, REU-aware","note":"A modern, still-maintained C64 operating system — proof the category didn't die in 1986. Same shape as GEOS underneath: a disk-resident application model dispatched through pointers.","needs":["indirect-calls","disk-streaming","optimizer"],"diff":"XL","conf":"inferred"},{"n":4,"title":"LUnix / LNG","year":1993,"publisher":"Daniel Dallmann","category":"OS / desktop","archetype":"preemptive multitasking kernel, virtual consoles","note":"Preemptive multitasking on a 6510. Its context switch saves and restores the stack pointer itself to give each task its own slice of the single 256-byte hardware stack — **a manoeuvre no high-level language can express**, and the sharpest example on this list of something that isn't a missing library but a missing level of access.","needs":["indirect-calls","asm","disk-io","optimizer"],"diff":"XL","conf":"known"},{"n":5,"title":"A GEM-style desktop, built fresh","category":"OS / desktop","archetype":"WIMP shell — overlapping windows, menus, pointer; built-in apps, one binary","note":"The floor of the question: no disk app-launching, no plugin ABI, a fixed widget set dispatched by a switch on widget type rather than through a pointer. That sidesteps every hard blocker, and what's left is redrawing a hires bitmap with window clipping and tracking a pointer inside the frame budget — a speed problem, not a language gap. **This is the only entry on this list that is merely Soon**, and it's worth knowing the shell itself was never the hard part.","needs":["optimizer"],"diff":"L","conf":"inferred"},{"n":6,"title":"GEM (Digital Research)","year":1985,"publisher":"Digital Research","category":"OS / desktop","archetype":"VDI + AES two-layer GUI, resource files, separate app binaries","note":"**GEM never shipped on the C64** — it was a 16-bit product (Atari ST, DOS, Apple), so this row scores what a faithful 6502 retarget would demand rather than a port that exists; the C64's own desktop was GEOS, above. The AES dispatches by function number into separately loaded application binaries, those binaries and their `.RSC` resources live on disk, and the VDI is a clipping raster library doing signed 16-bit coordinate maths with arcs, polygons and scaling.","needs":["disk-streaming","indirect-calls","asm","optimizer","math"],"diff":"XL","conf":"inferred"},{"n":7,"title":"Turbo Macro Pro","year":1994,"publisher":"Style","category":"Dev tool","archetype":"full-screen macro assembler, RAM-resident source","note":"The demoscene's standard assembler, and the most encouraging row here: editor, macro expansion, symbol table and code generation all fit in RAM, so the *only* thing it wants that Blend65 can't give it is opening a source file. A 6502 assembler hosted on the C64 is one capability away.","needs":["disk-io"],"diff":"L","conf":"known"},{"n":8,"title":"Power C","year":1987,"publisher":"Abacus","category":"Dev tool","archetype":"multi-pass C compiler with disk overlays","note":"A C compiler that runs on the machine it targets. Each pass overlays the last from disk and hands the next one an intermediate file — it needs both halves of the disk split at once, which is what a compiler on a 64 KB machine has always meant.","needs":["disk-streaming","disk-io","optimizer"],"diff":"XL","conf":"inferred"},{"n":9,"title":"Kyan Pascal","year":1986,"publisher":"Kyan Software","category":"Dev tool","archetype":"P-code Pascal compiler + editor","note":"Compiles to P-code and interprets it, which means the hot loop is a dispatch table indexed by opcode — the textbook case for indirect calls, and slow for exactly that reason.","needs":["disk-streaming","disk-io","indirect-calls"],"diff":"L","conf":"inferred"},{"n":10,"title":"Simons' BASIC","year":1983,"publisher":"Commodore","category":"Dev tool","archetype":"16 KB cartridge BASIC extension, 114 new keywords","note":"Ships as a cartridge ROM and works by hooking the interpreter's own vectors, so it needs the toolchain to emit a ROM image rather than a program — a build-output question, not a language one.","needs":["firmware","indirect-calls"],"diff":"M","conf":"known"},{"n":11,"title":"COMAL 80","year":1984,"publisher":"Commodore","category":"Dev tool","archetype":"cartridge language + structured interpreter","needs":["firmware","indirect-calls","disk-io"],"diff":"L","conf":"inferred"},{"n":12,"title":"Final Cartridge III","year":1987,"publisher":"Riska","category":"Dev tool","archetype":"freezer cartridge — monitor, fastload, windowed desktop","note":"A ROM image that has to take over a running machine, and shipped a windowed desktop of its own in 64 KB of cartridge space.","needs":["firmware","asm","disk-io","indirect-calls"],"diff":"XL","conf":"inferred"},{"n":13,"title":"Action Replay VI","year":1988,"publisher":"Datel","category":"Dev tool","archetype":"freezer cartridge, memory snapshot, fastload","needs":["firmware","asm","disk-streaming"],"diff":"XL","conf":"inferred"},{"n":14,"title":"CCGMS Terminal","year":1986,"publisher":"Craig Smith","category":"Comms","archetype":"software RS-232 terminal, bit-banged user port","note":"The C64 has no real UART, so the terminal *is* the serial port: the bit timing is generated in software against the raster and every cycle is spoken for. Nothing about that survives a compiler that reserves the right to schedule instructions differently.","needs":["asm","disk-io"],"diff":"L","conf":"known"},{"n":15,"title":"Novaterm 9.6","year":1998,"publisher":"Nick Rossi","category":"Comms","archetype":"SwiftLink terminal, Z-modem, scripting engine","needs":["asm","disk-streaming","indirect-calls"],"diff":"XL","conf":"inferred"},{"n":16,"title":"Color 64 BBS","year":1986,"publisher":"Greg Pfountz","category":"Comms","archetype":"modular BBS host, disk-resident message base","needs":["disk-streaming","indirect-calls","asm"],"diff":"XL","conf":"inferred"},{"n":17,"title":"IP65 TCP/IP stack","year":2009,"publisher":"Jonno Downes","category":"Comms","archetype":"6502 TCP/IP library, pluggable Ethernet drivers","note":"A library rather than an application, and notable for needing **no disk at all** — it is pure protocol code. What it does need is a driver table of function pointers, because the whole point is supporting several different Ethernet cartridges from one binary.","needs":["indirect-calls","asm"],"diff":"L","conf":"known"},{"n":18,"title":"SpeedScript 3.2","year":1985,"publisher":"COMPUTE! Publications","category":"Word processor","archetype":"5 KB machine-language editor, RAM-resident text","note":"A type-in magazine listing that turned into the most widely used word processor on the machine. Five kilobytes, everything in RAM, and the single thing it asks for is saving your document — the cleanest illustration on this page of how much of the application catalogue is one capability away.","needs":["disk-io"],"diff":"S","conf":"known"},{"n":19,"title":"PaperClip","year":1983,"publisher":"Batteries Included","category":"Word processor","archetype":"disk-based WP, external printer drivers","needs":["disk-io","indirect-calls"],"diff":"M","conf":"inferred"},{"n":20,"title":"Easy Script 64","year":1983,"publisher":"Commodore","category":"Word processor","archetype":"disk-based WP, 80-column virtual line","needs":["disk-io"],"diff":"M","conf":"inferred"},{"n":21,"title":"The Write Stuff","year":1988,"publisher":"Busy Bee Software","category":"Word processor","archetype":"disk-based WP with macro language","needs":["disk-io"],"diff":"M","conf":"inferred"},{"n":22,"title":"Fleet System 4","year":1987,"publisher":"Professional Software","category":"Word processor","archetype":"WP + 90,000-word disk-resident spell check","note":"The dictionary is the interesting part: 90,000 words cannot live in 64 KB alongside the editor, so the spell check streams it off disk. A word processor that needs the *expensive* half of disk access.","needs":["disk-streaming","disk-io"],"diff":"L","conf":"inferred"},{"n":23,"title":"Vizawrite 64","year":1984,"publisher":"Viza Software","category":"Word processor","archetype":"cartridge WP, WYSIWYG-leaning display","needs":["firmware","disk-io"],"diff":"M","conf":"inferred"},{"n":24,"title":"Multiplan","year":1983,"publisher":"Microsoft","category":"Spreadsheet","archetype":"cell grid with formula recalculation","note":"The row that genuinely needs fractional maths. A spreadsheet is a recalculation engine over numbers users expect to behave like money and measurements, which is a different problem from a game's fixed-point velocity.","needs":["math","disk-io"],"diff":"L","conf":"inferred"},{"n":25,"title":"Calc Result Advanced","year":1983,"publisher":"Handic","category":"Spreadsheet","archetype":"cartridge sheet, 32 linked pages","needs":["math","firmware","disk-io"],"diff":"L","conf":"inferred"},{"n":26,"title":"Vizastar 64","year":1985,"publisher":"Viza Software","category":"Spreadsheet","archetype":"integrated sheet + database + graphics, cartridge","needs":["math","firmware","disk-streaming"],"diff":"XL","conf":"inferred"},{"n":27,"title":"SuperBase 64","year":1984,"publisher":"Precision Software","category":"Database","archetype":"relative-file database, programmable","note":"A database is disk access wearing a user interface: the records never all fit in RAM, which is the definition of the streaming half.","needs":["disk-streaming","disk-io","indirect-calls"],"diff":"L","conf":"inferred"},{"n":28,"title":"Koala Painter","year":1983,"publisher":"Koala Technologies","category":"Art","archetype":"multicolor bitmap paint, tablet input","needs":["optimizer","disk-io"],"diff":"M","conf":"known"},{"n":29,"title":"Doodle!","year":1984,"publisher":"City Software","category":"Art","archetype":"hires bitmap paint","needs":["optimizer","disk-io"],"diff":"M","conf":"inferred"},{"n":30,"title":"Advanced Art Studio","year":1986,"publisher":"OCP","category":"Art","archetype":"paint package with windows and pull-down menus","needs":["optimizer","disk-io"],"diff":"L","conf":"inferred"},{"n":31,"title":"The Print Shop","year":1984,"publisher":"Brøderbund","category":"DTP / print","archetype":"card and banner composer, disk graphic libraries","note":"Graphics and fonts live in disk libraries you swap between, and every supported printer is a driver selected at runtime — two different reasons to need a pointer you can call.","needs":["disk-streaming","indirect-calls"],"diff":"L","conf":"inferred"},{"n":32,"title":"The Newsroom","year":1984,"publisher":"Springboard","category":"DTP / print","archetype":"page layout with disk clip-art","needs":["disk-streaming","optimizer"],"diff":"L","conf":"inferred"},{"n":33,"title":"Music Construction Set","year":1984,"publisher":"Electronic Arts","category":"Music","archetype":"notation editor + interrupt-driven player","note":"Worth noting what is *not* in this row: the sound itself. In-language SID music already ships, so a music editor is blocked on saving your song, not on making noise.","needs":["disk-io","optimizer"],"diff":"M","conf":"inferred"},{"n":34,"title":"DMC (Demo Music Creator)","year":1993,"publisher":"Graffity","category":"Music","archetype":"pattern tracker + IRQ playback routine","needs":["disk-io","optimizer"],"diff":"L","conf":"inferred"},{"n":35,"title":"Sidplayer","year":1985,"publisher":"COMPUTE! Publications","category":"Music","archetype":"plays .mus score files from disk","needs":["disk-io"],"diff":"S","conf":"inferred"},{"n":36,"title":"JiffyDOS","year":1989,"publisher":"CMD","category":"Firmware","archetype":"KERNAL + drive DOS ROM replacement, fast serial protocol","note":"Replaces the ROM at both ends of the serial cable and re-times the protocol between them. You are not building a program here, you are building two ROM images that have to agree with each other cycle by cycle — the clearest case for a firmware capability the matrix previously had no way to express.","needs":["firmware","asm"],"diff":"L","conf":"known"},{"n":37,"title":"Epyx Fast Load","year":1984,"publisher":"Epyx","category":"Firmware","archetype":"cartridge fastloader","needs":["firmware","asm"],"diff":"M","conf":"known"},{"n":38,"title":"Fast Hack'em","year":1985,"publisher":"Basement Boys Software","category":"Disk utility","archetype":"nibble copier, GCR routines run on the drive CPU","note":"Copies disks by shipping 6502 code *into the drive* and reading raw GCR bit patterns the DOS refuses to interpret. The target CPU isn't even the one the compiler is aiming at.","needs":["firmware","asm","disk-streaming"],"diff":"L","conf":"inferred"},{"n":39,"title":"Sky Travel","year":1984,"publisher":"Commodore","category":"Education","archetype":"planetarium — star catalogue + spherical trigonometry","note":"Spherical trigonometry over a star catalogue that doesn't fit in memory — the two planned-and-unplanned gaps meeting in one unusually ambitious piece of consumer software.","needs":["math","disk-streaming"],"diff":"L","conf":"inferred"},{"n":40,"title":"Cadpak 64","year":1984,"publisher":"Abacus","category":"CAD","archetype":"2D drafting with scaled and dimensioned output","needs":["math","optimizer","disk-io"],"diff":"L","conf":"inferred"}],"inversion":{"intro":"What shipping each capability unlocks — the number of the 100 titles that list it in their **Needs**. Read this to decide what to build next.","rows":[{"id":"optimizer","impact":"**The single biggest unlock.** Moves nearly every perf-bound scroller, shmup and brawler from Blocked/Soon toward Now. Already planned."},{"id":"disk-streaming","impact":"**The biggest hard-gap unlock in the game list.** Frees the entire disk catalogue — the RPGs (Ultima, Bard’s Tale, Pool of Radiance), SCUMM adventures, Cinemaware, Epyx multi-event sports, and the streamed Last Ninjas. No story exists today."},{"id":"disk-io","impact":"**Looks trivial on the game numbers and isn’t.** Only two games want it — but it is the single missing piece for most of the non-game software below, from a 5 KB word processor to a self-hosted assembler. Opening and saving a file is the cheapest large unlock on this page, and the game tallies hide that completely."},{"id":"asm","impact":"The 50 fps / vector ceiling the optimizer alone can’t reach: real-time 3D (Elite, Mercenary), sprite-scaling racers (Out Run), the full-colour scroll showcase (Mayhem in Monsterland)."},{"id":"math","impact":"Fractional physics: golf (Leaderboard), marble/ball physics (Marble Madness, Spindizzy), pseudo-3D road math. Hand-rollable today (why several are Soon, not Blocked); a library makes them clean."},{"id":"sound-sampled","impact":"Digitized speech (Impossible Mission-class). Doable in-language with tight timing; an effort, not a language gap."},{"id":"indirect-calls","impact":"True VM / dispatch-table engines (SCUMM). Also the clean way to call a ripped `.sid` player and any jump-table dispatch — a broad quality-of-life unlock beyond the raw count."},{"id":"firmware","impact":"Cartridge and KERNAL ROM images, plus 6502 code targeted at the drive’s own CPU. Narrow, and no game needs it — but it is the difference between building programs and building the fastloaders, freezer cartridges and DOS replacements the platform actually ran on."}],"bottomLine":"**Sequencing:** the **optimizer** first (planned; unlocks the most and the flashiest arcade action), then **disk file I/O** — cheap, and it moves almost the whole application catalogue at once — then **disk streaming** (frees the \"epic\" game catalogue the optimizer can never touch), and finally **hand-tuned asm** plus a **fixed-point math** library for the 3D / showcase tier. Splitting disk access into its two halves is what makes that order visible: the game list alone would have ranked all disk work as one expensive lump."},"provenance":["**The list is curated, not a sourced ranking.** These are 100 well-known, category-spanning C64 titles — not \"the top 100\" by any measured metric (sales, Zzap!64 score, Lemon64 votes). Swap freely with `/update_capability`.","**Verdicts anchor on *engine archetype*, the real feasibility driver**, then adjust for a title’s specifics. Where a title’s internals are inferred rather than known, the **Conf** column says so (⚠️/🔴) — treat those rows as archetype estimates, not reverse-engineered fact.","**Faithfulness bar is strict**: \"Now\" means the original *as played*. A reduced-scope demake that captures the feel but drops the smooth scroll, the multiplexed sprite count, the disk-streamed content, or the exact soundtrack is not \"Now\" — even when it would be a perfectly good game.","**Memory pressure is folded into difficulty, not a capability.** A title that strains 64 KB but fits with effort is not \"blocked\"; one whose data genuinely exceeds RAM needs *disk streaming*, and is marked so."],"footer":"Maintained via `/update_capability`. When a capability ships (the optimizer lands, a disk / loader story arrives, fixed-point math or asm-linking ships), re-run it to move every game waiting on that capability and refresh the counts.","derived":{"total":100,"summary":{"now":31,"soon":38,"blocked":31},"unlock":{"compiler":0,"optimizer":47,"sound-music":0,"sound-sampled":3,"joystick":0,"disk-io":2,"disk-streaming":15,"math":14,"asm":14,"indirect-calls":2,"firmware":0},"categories":["Maze","Action","Platform","Shooter","Puzzle","Adventure","Fighting","Beat-em-up","Sports","Racing","RPG","Sim/3D","Strategy","Sim"],"software":{"total":40,"summary":{"now":0,"soon":1,"blocked":39},"unlock":{"compiler":0,"optimizer":14,"sound-music":0,"sound-sampled":0,"joystick":0,"disk-io":23,"disk-streaming":16,"math":6,"asm":12,"indirect-calls":15,"firmware":11}}}}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("matrix-data").textContent);
const G = DATA.games;
const D = DATA.derived;
const CAP = Object.fromEntries(DATA.capabilities.map(c => [c.id, c]));
const TIER = Object.fromEntries(DATA.tiers.map(t => [t.id, t]));
const VMAP = Object.fromEntries(DATA.verdicts.map(v => [v.id, v]));
const CMAP = Object.fromEntries(DATA.scales.confidence.map(c => [c.key, c]));
const VORDER = Object.fromEntries(DATA.verdicts.map((v,i) => [v.id, i]));
const CORDER = Object.fromEntries(DATA.scales.confidence.map((c,i) => [c.key, i]));
const DORDER = Object.fromEntries(DATA.scales.diff.map((d,i) => [d, i]));
const TORDER = Object.fromEntries(DATA.tiers.map((t,i) => [t.id, i]));

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){
  return esc(s)
    .replace(/`([^`]+)`/g, (_,c)=>"<code>"+c+"</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" rel="noopener">$1</a>');
}
// a game's verdict is derived from its needs + capability tiers
function verdictOf(g){
  if(!g.needs.length) return "now";
  return g.needs.some(c => CAP[c].tier==="unplanned") ? "blocked" : "soon";
}
// needs sorted most-blocking first (unplanned before planned)
function sortedNeeds(g){
  return [...g.needs].sort((a,b)=> TORDER[CAP[b].tier]-TORDER[CAP[a].tier]);
}
const statusOfTier = id => TIER[id].status;

const state = { q:"", cat:"all", verdicts:new Set(), caps:new Set(), sort:{key:"n", dir:1} };

function passes(g){
  if(state.cat!=="all" && g.category!==state.cat) return false;
  if(state.verdicts.size && !state.verdicts.has(verdictOf(g))) return false;
  if(state.caps.size && ![...state.caps].some(c => g.needs.includes(c))) return false;
  if(state.q){
    const hay = (g.title+" "+(g.publisher||"")+" "+g.category+" "+g.archetype+" "+
                 g.needs.map(c=>CAP[c].name).join(" ")).toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}
function cmp(a,b){
  const k=state.sort.key; let x,y;
  if(k==="verdict"){x=VORDER[verdictOf(a)];y=VORDER[verdictOf(b)];}
  else if(k==="conf"){x=CORDER[a.conf];y=CORDER[b.conf];}
  else if(k==="diff"){x=DORDER[a.diff];y=DORDER[b.diff];}
  else if(k==="n"){x=a.n;y=b.n;}
  else if(k==="needs"){x=a.needs.length;y=b.needs.length;}
  else {x=String(a[k]).toLowerCase();y=String(b[k]).toLowerCase();}
  if(x<y) return -state.sort.dir; if(x>y) return state.sort.dir; return a.n-b.n;
}

function verdictCell(g){
  const v=VMAP[verdictOf(g)];
  return '<span class="verd '+v.status+'" title="'+esc(v.desc)+'">'+v.glyph+" "+esc(v.label)+"</span>";
}
function needsCell(g){
  if(!g.needs.length) return '<span class="dash">—</span>';
  return sortedNeeds(g).map(id=>{
    const c=CAP[id], on=state.caps.has(id)?" on":"";
    return '<span class="needchip'+on+'" data-cap="'+id+'" title="'+esc(TIER[c.tier].label)+'">'+
           '<span class="tdot '+statusOfTier(c.tier)+'"></span>'+esc(c.name)+"</span>";
  }).join("");
}
function rowHtml(g){
  const pub=g.publisher?", "+g.publisher:"";
  const c=CMAP[g.conf];
  return "<tr>"+
    '<td class="num">'+g.n+"</td>"+
    "<td><span class=gtitle>"+esc(g.title)+'</span> <span class=gmeta>('+g.year+esc(pub)+")</span></td>"+
    "<td>"+esc(g.category)+"</td>"+
    '<td class="arch">'+esc(g.archetype)+"</td>"+
    '<td class="c">'+verdictCell(g)+"</td>"+
    "<td>"+needsCell(g)+"</td>"+
    '<td class="c diff">'+g.diff+"</td>"+
    '<td class="conf"><span class="cdot '+g.conf+'"></span>'+esc(c.label)+"</td>"+
    "</tr>";
}
function renderTable(){
  const rows=G.filter(passes).sort(cmp);
  const body=document.getElementById("tbody");
  body.innerHTML = rows.length
    ? rows.map(rowHtml).join("")
    : '<tr><td class="empty" colspan="8">No games match these filters.</td></tr>';
  document.getElementById("count").textContent="Showing "+rows.length+" of "+D.total;
  document.querySelectorAll("th button[data-key]").forEach(b=>{
    const a=b.querySelector(".arw"); if(a) a.textContent = b.dataset.key===state.sort.key ? (state.sort.dir>0?"▲":"▼") : "";
  });
  syncCapChips();
}

function bars(){
  const mk=(label,id)=>{
    const n=D.summary[id]||0, total=D.total;
    const seg='<span class="seg '+VMAP[id].status+'" style="flex:'+n+'" title="'+
      esc(VMAP[id].label)+': '+n+'">'+(n>=4?n:"")+"</span>";
    return {n,seg};
  };
  const segs=DATA.verdicts.map(v=>mk(v.label,v.id).seg).join("");
  const leg=DATA.verdicts.map(v=>'<span><span class="dot '+v.status+'"></span><b>'+v.glyph+" "+
    esc(v.label)+"</b> — "+esc(v.desc)+"</span>").join("");
  return '<div class="bars"><div class="bar-row"><div class="bar-lab">Buildable</div>'+
    '<div class="bar">'+segs+'</div></div><div class="legend-row">'+leg+"</div></div>";
}

function board(){
  const groups=DATA.tiers.map(t=>{
    const caps=DATA.capabilities.filter(c=>c.tier===t.id);
    const chips=caps.map(c=>{
      const cnt=D.unlock[c.id]||0, on=state.caps.has(c.id)?" on":"";
      return '<span class="capchip t-'+t.id+on+'" data-cap="'+c.id+'" title="'+esc(c.blurb)+'">'+
        '<span class="tdot '+t.status+'"></span>'+esc(c.name)+
        '<span class="n">'+cnt+"</span></span>";
    }).join("");
    return '<div class="tiergroup"><div class="tiername">'+t.glyph+" "+esc(t.label)+
      "<small>"+(t.id==="available"?"games blocked on it":"games waiting")+"</small></div>"+
      '<div class="capchips">'+chips+"</div></div>";
  }).join("");
  return '<div class="board">'+groups+"</div>";
}

function controls(){
  const cats=['<option value="all">All categories</option>']
    .concat(D.categories.map(c=>'<option value="'+esc(c)+'">'+esc(c)+"</option>")).join("");
  const vchips=DATA.verdicts.map(v=>
    '<button class="chip v '+v.status+'" data-verdict="'+v.id+'">'+v.glyph+" "+esc(v.label)+"</button>").join("");
  return '<div class="controls">'+
    '<input type="search" id="q" placeholder="Search game, archetype…" aria-label="Search">'+
    '<select id="cat" aria-label="Category filter">'+cats+"</select>"+
    '<span class="filtlabel">buildable</span>'+vchips+
    '<button class="reset" id="reset">Reset</button>'+
    '<span class="count" id="count"></span></div>';
}

function refTables(){
  const capRows=DATA.capabilities.map(c=>
    "<tr><td><strong>"+esc(c.name)+'</strong></td><td><span class="tdot '+TIER[c.tier].status+
    '" style="display:inline-block;margin-right:6px"></span>'+esc(TIER[c.tier].label)+
    '</td><td class="c diff">'+(D.unlock[c.id]||0)+"</td><td>"+md(c.blurb)+"</td></tr>").join("");
  const inv=DATA.inversion.rows.map(r=>{
    const c=CAP[r.id];
    return "<tr><td><strong>"+esc(c.name)+'</strong></td><td class="c diff">'+(D.unlock[r.id]||0)+
      "</td><td>"+md(r.impact)+"</td></tr>";
  }).join("");
  const howto=DATA.howToRead.map(x=>"<li>"+md(x)+"</li>").join("");
  const notes=DATA.notes.map(x=>"<li>"+md(x)+"</li>").join("");
  const prov=DATA.provenance.map(x=>"<li>"+md(x)+"</li>").join("");

  return '<h2>Reference</h2>'+
    "<details open><summary>Prioritization — what shipping each capability unlocks</summary>"+
      "<p>"+md(DATA.inversion.intro)+"</p>"+
      '<table class="ref"><thead><tr><th>Capability</th><th class="c">Titles</th><th>Impact</th></tr></thead><tbody>'+inv+"</tbody></table>"+
      "<p>"+md(DATA.inversion.bottomLine)+"</p></details>"+
    "<details><summary>Capability details</summary>"+
      '<table class="ref"><thead><tr><th>Capability</th><th>Status</th><th class="c">Waiting</th><th>What it is</th></tr></thead><tbody>'+capRows+"</tbody></table></details>"+
    "<details><summary>How to read this</summary><ul class=notes>"+howto+"</ul>"+
      "<ul class=notes>"+notes+"</ul></details>"+
    "<details><summary>Provenance &amp; confidence caveats</summary><ul class=notes>"+prov+"</ul></details>";
}

// The software table is static — no filters, and its Needs chips are inert so a click
// there can never silently re-filter the game table above it.
function needsCellStatic(r){
  if(!r.needs.length) return '<span class="dash">—</span>';
  return sortedNeeds(r).map(id=>{
    const c=CAP[id];
    return '<span class="needchip static" title="'+esc(TIER[c.tier].label)+'">'+
           '<span class="tdot '+statusOfTier(c.tier)+'"></span>'+esc(c.name)+"</span>";
  }).join("");
}
function softwareSection(){
  if(!DATA.software || !DATA.software.length) return "";
  const intro=(DATA.softwareIntro?DATA.softwareIntro.blurb:[]).map(p=>"<p class=purpose>"+md(p)+"</p>").join("");
  const sum=DATA.verdicts.map(v=>{
    const n=D.software.summary[v.id]||0;
    return n ? '<span class="verd '+v.status+'">'+v.glyph+" "+n+" "+esc(v.label)+"</span>" : "";
  }).filter(Boolean).join(" ");
  const head="<thead><tr><th class=c>#</th><th>Software</th><th>Kind</th><th>Archetype</th>"+
    '<th class=c>Buildable?</th><th>Needs</th><th class=c>Diff</th><th>Conf</th></tr></thead>';
  const rows=DATA.software.map(s=>{
    const meta=s.year ? " ("+s.year+(s.publisher?", "+esc(s.publisher):"")+")" : "";
    const c=CMAP[s.conf];
    const main='<tr class="softhead"><td class="num">'+s.n+"</td>"+
      "<td><span class=gtitle>"+esc(s.title)+'</span> <span class=gmeta>'+meta+"</span></td>"+
      "<td>"+esc(s.category)+"</td>"+
      '<td class="arch">'+esc(s.archetype)+"</td>"+
      '<td class="c">'+verdictCell(s)+"</td>"+
      "<td>"+needsCellStatic(s)+"</td>"+
      '<td class="c diff">'+s.diff+"</td>"+
      '<td class="conf"><span class="cdot '+s.conf+'"></span>'+esc(c.label)+"</td></tr>";
    const note=s.note ? '<tr class="softnote"><td></td><td colspan="7">'+md(s.note)+"</td></tr>" : "";
    return main+note;
  }).join("");
  // Ranked by how many of these entries wait on each capability — a different order
  // from the game board above, which is the finding this section exists to show.
  const ranked=DATA.capabilities
    .map(c=>({c,n:D.software.unlock[c.id]||0}))
    .filter(x=>x.n>0)
    .sort((a,b)=>b.n-a.n);
  const strip=ranked.map(({c,n})=>
    '<span class="capchip static t-'+c.tier+'" title="'+esc(TIER[c.tier].label)+'">'+
    '<span class="tdot '+statusOfTier(c.tier)+'"></span>'+esc(c.name)+
    '<span class="n">'+n+"</span></span>").join("");
  const title=(DATA.softwareIntro&&DATA.softwareIntro.title)||"Non-game software";
  return "<h2>"+esc(title)+"</h2>"+intro+
    '<div class="board"><div class="tiergroup"><div class="tiername">Waiting on'+
      "<small>of these "+D.software.total+" entries</small></div>"+
      '<div class="capchips">'+strip+"</div></div></div>"+
    '<p class="softsum">'+sum+"</p>"+
    '<div class="tablewrap"><table>'+head+"<tbody>"+rows+"</tbody></table></div>";
}

function render(){
  const app=document.getElementById("app");
  const purpose=DATA.intro.purpose.map(p=>"<p class=purpose>"+md(p)+"</p>").join("");
  app.innerHTML=
    '<div class="topbar"><div><h1>'+esc(DATA.meta.title)+"</h1>"+
      '<p class="sub">Last updated '+esc(DATA.meta.lastUpdated)+
      " · refresh with <code>"+esc(DATA.meta.refreshWith)+"</code></p></div>"+
      '<button class="themebtn" id="theme">◐ Theme</button></div>'+
    purpose+
    '<h2>At a glance</h2>'+bars()+
    '<h2>Capability status <span class="gmeta">— the lever: ship one, everything waiting on it moves</span></h2>'+board()+
    '<h2>The matrix</h2>'+controls()+
    '<div class="tablewrap"><table>'+refHead()+'<tbody id="tbody"></tbody></table></div>'+
    softwareSection()+
    refTables()+
    '<p class="foot">'+md(DATA.footer)+"</p>";
  app.removeAttribute("aria-busy");
  wire();
  renderTable();
}
function refHead(){
  const cols=[["n","#",1],["title","Game"],["category","Cat"],["archetype","Archetype"],
    ["verdict","Buildable?",1],["needs","Needs",1],["diff","Diff",1],["conf","Conf",1]];
  return "<thead><tr>"+cols.map(([k,l,c])=>
    '<th class="'+(c?"c":"")+'"><button data-key="'+k+'">'+esc(l)+' <span class="arw"></span></button></th>').join("")+"</tr></thead>";
}

function wire(){
  document.getElementById("q").addEventListener("input", e=>{state.q=e.target.value.trim().toLowerCase();renderTable();});
  document.getElementById("cat").addEventListener("change", e=>{state.cat=e.target.value;renderTable();});
  document.getElementById("reset").addEventListener("click", ()=>{
    state.q="";state.cat="all";state.verdicts.clear();state.caps.clear();
    document.getElementById("q").value="";document.getElementById("cat").value="all";
    syncVerdictChips();refreshBarsBoard();renderTable();
  });
  document.querySelectorAll("[data-verdict]").forEach(b=>b.addEventListener("click", ()=>{
    toggle(state.verdicts,b.dataset.verdict);syncVerdictChips();renderTable();
  }));
  document.querySelectorAll("th button[data-key]").forEach(b=>b.addEventListener("click", ()=>{
    const k=b.dataset.key;
    if(state.sort.key===k) state.sort.dir*=-1; else state.sort={key:k,dir:1};
    renderTable();
  }));
  // capability toggles come from the board and from Needs chips in rows
  document.addEventListener("click", e=>{
    const el=e.target.closest("[data-cap]"); if(!el) return;
    if(el.classList.contains("t-available")) return; // available caps have nothing waiting
    toggle(state.caps, el.dataset.cap); syncCapChips(); renderTable();
  });
  document.getElementById("theme").addEventListener("click", toggleTheme);
}
function toggle(set,v){ set.has(v)?set.delete(v):set.add(v); }
function syncVerdictChips(){
  document.querySelectorAll("[data-verdict]").forEach(b=>b.classList.toggle("on", state.verdicts.has(b.dataset.verdict)));
}
function syncCapChips(){
  document.querySelectorAll("[data-cap]").forEach(el=>el.classList.toggle("on", state.caps.has(el.dataset.cap)));
}
function refreshBarsBoard(){
  document.querySelector(".bars").outerHTML=bars();
  document.querySelector(".board").outerHTML=board();
}
function toggleTheme(){
  const root=document.documentElement;
  const dark=root.getAttribute("data-theme")==="dark" ||
    (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark?"light":"dark");
}
render();
</script>
</body>
</html>
