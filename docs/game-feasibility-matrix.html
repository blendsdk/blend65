<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blend65 — C64 Game Feasibility Matrix</title>
<style>
*{box-sizing:border-box}
:root{
  color-scheme:light;
  --surface:#fcfcfb;--plane:#f9f9f7;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);--accent:#2a78d6;
  --good:#0ca30c;--warning:#fab219;--critical:#d03b3b;
  --good-bg:rgba(12,163,12,.12);--warning-bg:rgba(250,178,25,.18);--critical-bg:rgba(208,59,59,.12);
  --chip:rgba(11,11,11,.05);--chip-on:#2a78d6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --surface:#1a1a19;--plane:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.12);--accent:#3987e5;
  --good-bg:rgba(12,163,12,.20);--warning-bg:rgba(250,178,25,.16);--critical-bg:rgba(208,59,59,.22);
  --chip:rgba(255,255,255,.07);--chip-on:#3987e5;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface:#1a1a19;--plane:#0d0d0d;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.12);--accent:#3987e5;
  --good-bg:rgba(12,163,12,.20);--warning-bg:rgba(250,178,25,.16);--critical-bg:rgba(208,59,59,.22);
  --chip:rgba(255,255,255,.07);--chip-on:#3987e5;
}
html,body{margin:0}
body{background:var(--plane);color:var(--ink);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:24px;max-width:1180px;margin:0 auto;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
h1{font-size:1.5rem;margin:0 0 2px}
h2{font-size:1.05rem;margin:28px 0 10px;letter-spacing:.01em}
p{margin:.5em 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86em;
  background:var(--chip);padding:.05em .35em;border-radius:4px}
.sub{color:var(--ink2);font-size:.9rem;margin:0 0 4px}
.purpose{color:var(--ink2);max-width:78ch}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.themebtn{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:7px 11px;cursor:pointer;font-size:.85rem}
.themebtn:hover{border-color:var(--accent)}

/* summary bars */
.bars{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.bar-lab{font-weight:600;font-size:.9rem}
.bar{display:flex;height:26px;gap:2px;border-radius:6px;overflow:hidden}
.seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.78rem;
  font-weight:650;min-width:2px;font-variant-numeric:tabular-nums}
.seg.good{background:var(--good)}.seg.warning{background:var(--warning);color:#3a2a00}
.seg.critical{background:var(--critical)}
.legend-row{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--ink2)}
.legend-row b{font-weight:650;color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dot.good{background:var(--good)}.dot.warning{background:var(--warning)}.dot.critical{background:var(--critical)}

/* capability status board */
.board{display:grid;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:16px 18px}
.tiergroup{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.tiername{font-weight:650;font-size:.85rem;white-space:nowrap}
.tiername small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.capchips{display:flex;gap:7px;flex-wrap:wrap}
.capchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
  background:var(--chip);border-radius:999px;padding:4px 6px 4px 11px;font-size:.82rem;
  font-weight:600;cursor:pointer;color:var(--ink)}
.capchip:hover{border-color:var(--accent)}
.capchip.on{background:var(--chip-on);color:#fff;border-color:transparent}
.capchip .n{font-variant-numeric:tabular-nums;font-size:.72rem;background:rgba(0,0,0,.12);
  border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.capchip.on .n{background:rgba(255,255,255,.25)}
.capchip.t-available{cursor:default;opacity:.85}
.capchip.t-available:hover{border-color:var(--border)}
.tdot{width:9px;height:9px;border-radius:50%;flex:none}
.tdot.good{background:var(--good)}.tdot.warning{background:var(--warning)}.tdot.critical{background:var(--critical)}

/* controls */
.controls{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin:16px 0 10px}
.controls input[type=search],.controls select{
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:8px 10px;font:inherit;font-size:.88rem}
.controls input[type=search]{min-width:220px}
.chip{border:1px solid var(--border);background:var(--chip);color:var(--ink);
  border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.82rem;font-weight:600;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.v.on.good{background:var(--good);color:#fff;border-color:transparent}
.chip.v.on.warning{background:var(--warning);color:#3a2a00;border-color:transparent}
.chip.v.on.critical{background:var(--critical);color:#fff;border-color:transparent}
.reset{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;font-size:.84rem}
.count{color:var(--ink2);font-size:.85rem;margin-left:auto;font-variant-numeric:tabular-nums}
.filtlabel{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}

/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
thead th{position:sticky;top:0;background:var(--surface);z-index:1;text-align:left;
  border-bottom:2px solid var(--axis);white-space:nowrap;padding:0}
thead th button{width:100%;text-align:left;background:none;border:0;color:var(--ink2);
  font:inherit;font-weight:650;padding:11px 12px;cursor:pointer;white-space:nowrap}
thead th button:hover{color:var(--ink)}
thead th .arw{color:var(--accent);font-size:.72rem}
th.c,td.c{text-align:center}
tbody td{border-bottom:1px solid var(--grid);padding:9px 12px;vertical-align:top}
tbody tr:hover td{background:var(--chip)}
td.num{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;padding-right:14px}
.gtitle{font-weight:650}
.gmeta{color:var(--muted);font-weight:400;font-size:.82rem}
.arch{color:var(--ink2)}
.verd{white-space:nowrap;font-weight:650;border-radius:6px;padding:3px 9px;display:inline-block}
.verd.good{background:var(--good-bg)}.verd.warning{background:var(--warning-bg)}
.verd.critical{background:var(--critical-bg)}
.needchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);
  border-radius:6px;background:var(--chip);padding:2px 8px;margin:1px 3px 1px 0;font-size:.78rem;
  font-weight:600;cursor:pointer}
.needchip:hover{border-color:var(--accent)}
.needchip.on{background:var(--chip-on);color:#fff;border-color:transparent}
.needchip .tdot{width:7px;height:7px}
.dash{color:var(--muted)}
.diff{font-weight:650;font-variant-numeric:tabular-nums}
.conf{white-space:nowrap;color:var(--ink2);font-size:.82rem}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.cdot.known{background:var(--good)}.cdot.inferred{background:var(--warning)}.cdot.low{background:var(--critical)}
.empty{padding:26px;text-align:center;color:var(--muted)}

/* collapsibles + reference tables */
details{border:1px solid var(--border);border-radius:10px;background:var(--surface);
  padding:2px 16px;margin:10px 0}
details[open]{padding-bottom:14px}
summary{cursor:pointer;font-weight:650;padding:12px 0;color:var(--ink)}
summary:hover{color:var(--accent)}
.ref{border-collapse:collapse;width:100%;font-size:.85rem;margin-top:4px}
.ref th,.ref td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
.ref th{color:var(--ink2);font-weight:650}
ul.notes{margin:.3em 0;padding-left:1.15em}
ul.notes li{margin:.4em 0}
.foot{color:var(--muted);font-size:.82rem;margin:26px 0 8px;font-style:italic}
@media (max-width:640px){body{padding:14px}.count{margin-left:0;width:100%}
  .tiergroup{grid-template-columns:1fr}}
</style>
</head>

<script id="matrix-data" type="application/json">{"_readme":"SOURCE OF TRUTH for the C64 game feasibility matrix. Edit this file, then run `node scripts/gen-capability-matrix.mjs` (or `yarn gen:matrix`) to regenerate docs/game-feasibility-matrix.html. Each game lists the capabilities it `needs` (ids from `capabilities`); a game with an empty `needs` is buildable Now. The Buildable verdict (Now/Soon/Blocked), the summary tallies, and the per-capability unlock counts are all DERIVED by the generator from `needs` + each capability `tier` — never stored here. Confidence keys: known|inferred|low. Diff: S|M|L|XL.","meta":{"title":"Blend65 — C64 Game Feasibility Matrix","lastUpdated":"2026-07-17","refreshWith":"/update_capability"},"intro":{"purpose":["A capability-grounded assessment of whether 100 well-known Commodore 64 games could be built **faithfully** with the Blend65 toolchain. Every game is judged by the **capabilities it needs** — compiler, an optimizer for speed, sound, input, graphics loading, math — and which of those exist today. A game is buildable **Now** when every capability it needs already ships, **Soon** when it only waits on a *planned* capability, and **Blocked** when it needs one that *isn’t planned*.","**No sugarcoating.** A game is only **Now** if it can be built as the original *played* — right engine, right controls, clean in-language audio, no missing essentials, and no dropping to hand-poked machine-code bytes. A reduced-scope demake is not \"Now\"."]},"capabilities":[{"id":"compiler","name":"Compiler & language","tier":"available","blurb":"The frozen v3 language compiles end-to-end to 6502 (RD-18 complete). Every game needs it; none is blocked on it any more."},{"id":"optimizer","name":"Optimizer (speed)","tier":"planned","blurb":"A cycle-budget optimizer. Unlocks smooth per-frame scrolling and sprite multiplexing (>8 sprites) within the frame budget."},{"id":"sound-music","name":"Sound — music & SFX","tier":"available","blurb":"SID music and effects, written in-language and poked to the sound registers each frame."},{"id":"sound-sampled","name":"Sound — sampled speech","tier":"planned","blurb":"Digitized speech / sample playback with tight timing. Doable in-language; an effort, not a language gap."},{"id":"joystick","name":"Joystick / input","tier":"available","blurb":"Reading the joysticks and keyboard via the CIA ports with `peek`."},{"id":"graphics-loading","name":"Graphics / data loading","tier":"unplanned","blurb":"Disk multi-load, streaming, and data sets larger than 64 KB. No loader / KERNAL story exists yet."},{"id":"math","name":"Math (fixed-point / float)","tier":"planned","blurb":"Fractional math. No floating point in the language; a fixed-point library would make hand-rolled physics clean."},{"id":"asm","name":"Hand-tuned asm","tier":"unplanned","blurb":"Linking cycle-exact hand-written assembly for 50 fps showcases and real-time 3D. Deferred, unscheduled."},{"id":"indirect-calls","name":"Indirect calls / dispatch","tier":"unplanned","blurb":"Function pointers, jump tables, VM-style dispatch (SCUMM engines, calling a ripped `.sid` player). Deferred, unscheduled."}],"tiers":[{"id":"available","label":"Available now","glyph":"✅","status":"good"},{"id":"planned","label":"Planned","glyph":"🟡","status":"warning"},{"id":"unplanned","label":"Not planned","glyph":"❌","status":"critical"}],"verdicts":[{"id":"now","label":"Now","glyph":"✅","status":"good","desc":"every capability it needs ships today"},{"id":"soon","label":"Soon","glyph":"🟡","status":"warning","desc":"only waiting on planned capabilities"},{"id":"blocked","label":"Blocked","glyph":"❌","status":"critical","desc":"needs a capability that isn’t planned"}],"scales":{"confidence":[{"key":"known","glyph":"✅","label":"internals known"},{"key":"inferred","glyph":"⚠️","label":"inferred from archetype"},{"key":"low","glyph":"🔴","label":"low"}],"diff":["S","M","L","XL"]},"howToRead":["**Buildable?** rolls up the capabilities a game needs: **✅ Now** — all of them ship today · **🟡 Soon** — the only ones missing are *planned* · **❌ Blocked** — it needs a capability that *isn’t planned*.","**Needs** lists the missing capabilities, most-blocking first. A **Now** game needs nothing it doesn’t already have (shown as `—`).","**The capability status board** above is the lever: ship one capability and *every* game waiting on it moves. The unlock counts show how many.","**Difficulty** (S/M/L/XL) is implementation effort, independent of buildability. **Confidence** — ✅ internals known · ⚠️ inferred from archetype · 🔴 low.","**Faithfulness bar is strict**: \"Now\" means the original *as played* — not a reduced-scope demake that drops the smooth scroll, the disk content, or the exact soundtrack."],"notes":["**Original-soundtrack footnote.** In-language SID music and effects are clean (*Sound — music & SFX*, available now). Reproducing a *ripped* `.sid` tune byte-for-byte means calling its own machine-code player routine, which needs **Indirect calls** — so a byte-faithful ripped soundtrack carries an implicit indirect-calls dependency. It is not added to every row."],"summaryNote":"The **Blocked** titles all need a capability that isn’t planned — **graphics loading** (the disk RPGs, SCUMM adventures, Cinemaware, Epyx multi-event sports, the streamed Last Ninjas), **hand-tuned asm** (real-time 3D and the 50 fps showcases: Elite, Out Run, Mayhem in Monsterland), or **indirect calls** (SCUMM dispatch). No optimizer reaches them — they need a new capability, not faster code. See the unlock table at the bottom.","games":[{"n":1,"title":"Pac-Man","year":82,"publisher":"Atarisoft","category":"Maze","archetype":"single-screen maze","needs":[],"diff":"S","conf":"known"},{"n":2,"title":"Ms. Pac-Man","year":83,"publisher":"Atarisoft","category":"Maze","archetype":"single-screen maze","needs":[],"diff":"S","conf":"known"},{"n":3,"title":"Dig Dug","year":83,"publisher":"Atarisoft","category":"Maze","archetype":"single-screen dig","needs":[],"diff":"S","conf":"known"},{"n":4,"title":"Frogger","year":83,"publisher":"Sierra","category":"Action","archetype":"single-screen lanes","needs":[],"diff":"S","conf":"known"},{"n":5,"title":"Q*bert","year":83,"publisher":"Parker","category":"Action","archetype":"iso single-screen","needs":[],"diff":"M","conf":"known"},{"n":6,"title":"Donkey Kong","year":83,"publisher":"Atarisoft","category":"Platform","archetype":"single-screen platform","needs":[],"diff":"M","conf":"known"},{"n":7,"title":"Space Invaders","year":81,"publisher":null,"category":"Shooter","archetype":"single-screen fixed","needs":[],"diff":"S","conf":"known"},{"n":8,"title":"Galaga","year":84,"publisher":null,"category":"Shooter","archetype":"single-screen fixed","needs":[],"diff":"M","conf":"known"},{"n":9,"title":"Bomb Jack","year":86,"publisher":"Elite","category":"Platform","archetype":"single-screen platform","needs":[],"diff":"M","conf":"known"},{"n":10,"title":"Bubble Bobble","year":87,"publisher":"Firebird","category":"Platform","archetype":"single-screen (2P)","needs":["optimizer"],"diff":"L","conf":"known"},{"n":11,"title":"Bruce Lee","year":84,"publisher":"Datasoft","category":"Platform","archetype":"flip-screen platform","needs":[],"diff":"M","conf":"known"},{"n":12,"title":"Manic Miner","year":83,"publisher":"Software Projects","category":"Platform","archetype":"flip-screen platform","needs":[],"diff":"M","conf":"known"},{"n":13,"title":"Jet Set Willy","year":84,"publisher":"Software Projects","category":"Platform","archetype":"flip-screen platform","needs":[],"diff":"M","conf":"known"},{"n":14,"title":"Impossible Mission","year":84,"publisher":"Epyx","category":"Platform","archetype":"flip-screen platform","needs":["sound-sampled"],"diff":"L","conf":"known"},{"n":15,"title":"Impossible Mission II","year":88,"publisher":"Epyx","category":"Platform","archetype":"flip-screen multi-zone","needs":["sound-sampled"],"diff":"L","conf":"inferred"},{"n":16,"title":"Lode Runner","year":83 ":"Barbarian","year":87,"publisher":"Palace","category":"Fighting","archetype":"single-screen duel","needs":[],"diff":"L","conf":"known"},{"n":53,"title":"Barbarian II","year":88,"publisher":"Palace","category":"Fighting","archetype":"scroll explore + duel","needs":["optimizer"],"diff":"L","conf":"inferred"},{"n":54,"title":"Renegade","year":87,"publisher":"Ocean","category":"Beat-em-up","archetype":"hscroll brawler","needs":["optimizer"],"diff":"L","conf":"inferred"},{"n":55,"title":"Target Renegade","year":88,"publisher":"Ocean","category":"Beat-em-up","archetype":"hscroll brawler","needs":["optimizer"],"diff":"L","conf":"inferred"},{"n":56,"title":"Double Dragon","year":88,"publisher":"Melbourne House","category":"Beat-em-up","archetype":"hscroll brawler","needs":["optimizer"],"diff":"L","conf":"known"},{"n":57,"title":"Boulder Dash","year":84,"publisher":"First Star","category":"Puzzle","archetype":"scrolling cave puzzle","needs":[],"diff":"M","conf":"known"},{"n":58,"title":"Boulder Dash Construction Kit","year":86,"publisher":"First Star","category":"Puzzle","archetype":"puzzle + editor","needs":[],"diff":"M","conf":"inferred"},{"n":59,"title":"Tetris","year":88,"publisher":"Mirrorsoft","category":"Puzzle","archetype":"single-screen puzzle","needs":[],"diff":"S","conf":"known"},{"n":60,"title":"Klax","year":90,"publisher":"Domark","category":"Puzzle","archetype":"single-screen puzzle","needs":[],"diff":"S","conf":"known"},{"n":61,"title":"Pipe Mania","year":89,"publisher":"Empire","category":"Puzzle","archetype":"single-screen puzzle","needs":[],"diff":"S","conf":"known"},{"n":62,"title":"Puzznic","year":90,"publisher":"Ocean","category":"Puzzle","archetype":"single-screen puzzle","needs":[],"diff":"S","conf":"inferred"},{"n":63,"title":"Bombuzal","year":88,"publisher":"Image Works","category":"Puzzle","archetype":"iso/flat puzzle","needs":[],"diff":"M","conf":"inferred"},{"n":64,"title":"Shanghai","year":86,"publisher":"Activision","category":"Puzzle","archetype":"mahjong solitaire","needs":[],"diff":"S","conf":"known"},{"n":65,"title":"The Sentinel","year":86,"publisher":"Firebird","category":"Puzzle","archetype":"3D filled-poly puzzle","needs":["math","asm"],"diff":"XL","conf":"inferred"},{"n":66,"title":"Summer Games","year":84,"publisher":"Epyx","category":"Sports","archetype":"multi-event (disk)","needs":["graphics-loading"],"diff":"L","conf":"known"},{"n":67,"title":"Winter Games","year":85,"publisher":"Epyx","category":"Sports","archetype":"multi-event (disk)","needs":["graphics-loading"],"diff":"L","conf":"known"},{"n":68,"title":"California Games","year":87,"publisher":"Epyx","category":"Sports","archetype":"multi-event (disk)","needs":["math","graphics-loading"],"diff":"L","conf":"known"},{"n":69,"title":"World Games","year":86,"publisher":"Epyx","category":"Sports","archetype":"multi-event (disk)","needs":["graphics-loading"],"diff":"L","conf":"inferred"},{"n":70,"title":"Track & Field","year":83,"publisher":"Konami","category":"Sports","archetype":"single-screen events","needs":["optimizer","sound-sampled"],"diff":"M","conf":"inferred"},{"n":71,"title":"Leaderboard Golf","year":86,"publisher":"Access","category":"Sports","archetype":"golf sim","needs":["math"],"diff":"M","conf":"inferred"},{"n":72,"title":"HardBall!","year":85,"publisher":"Accolade","category":"Sports","archetype":"baseball sim","needs":["optimizer"],"diff":"L","conf":"inferred"},{"n":73,"title":"Kick Off","year":89,"publisher":"Anco","category":"Sports","archetype":"top-down football","needs":["optimizer"],"diff":"L","conf":"known"},{"n":74,"title":"MicroProse Soccer","year":88,"publisher":"MicroProse","category":"Sports","archetype":"top-down football","needs":["optimizer"],"diff":"L","conf":"inferred"},{"n":75,"title":"International Soccer","year":83,"publisher":"Commodore","category":"Sports","archetype":"side-view football","needs":["optimizer"],"diff":"M","conf":"inferred"},{"n":76,"title":"Out Run","year":87,"publisher":"US Gold","category":"Racing","archetype":"pseudo-3D + sprite scaling","needs":["optimizer","math","asm"],"diff":"XL","conf":"known"},{"n":77,"title":"Pole Position","year":83,"publisher":"Atarisoft","category":"Racing","archetype":"pseudo-3D road","needs":["optimizer","math"],"diff":"L","conf":"inferred"},{"n":78,"title":"Pitstop II","year":84,"publisher":"Epyx","category":"Racing","archetype":"pseudo-3D split-screen","needs":["optimizer","math"],"diff":"L","conf":"inferred"},{"n":79,"title":"Buggy Boy","year":87,"publisher":"Elite","category":"Racing","archetype":"pseudo-3D road","needs":["optimizer","math","asm"],"diff":"L","conf":"inferred"},{"n":80,"title":"Chase H.Q.","year":89,"publisher":"Ocean","category":"Racing","archetype":"pseudo-3D chase","needs":["optimizer","math","asm"],"diff":"L","conf":"known"},{"n":81,"title":"Lotus Esprit Turbo Challenge","year":90,"publisher":"Gremlin","category":"Racing","archetype":"pseudo-3D road","needs":["optimizer","math","asm"],"diff":"L","conf":"inferred"},{"n":82,"title":"Super Cars","year":90,"publisher":"Gremlin","category":"Racing","archetype":"top-down racer","needs":["optimizer"],"diff":"M","conf":"inferred"},{"n":83,"title":"Wec Le Mans","year":88,"publisher":"Imagine","category":"Racing","archetype":"pseudo-3D road","needs":["optimizer","math","asm"],"diff":"L","conf":"inferred"},{"n":84,"title":"Maniac Mansion","year":87,"publisher":"Lucasfilm","category":"Adventure","archetype":"SCUMM point-click (disk)","needs":["graphics-loading","indirect-calls"],"diff":"XL","conf":"known"},{"n":85,"title":"Zak McKracken","year":88,"publisher":"Lucasfilm","category":"Adventure","archetype":"SCUMM point-click (disk)","needs":["graphics-loading","indirect-calls"],"diff":"XL","conf":"known"},{"n":86,"title":"Defender of the Crown","year":87,"publisher":"Cinemaware","category":"Adventure","archetype":"bitmap + minigames (disk)","needs":["graphics-loading"],"diff":"L","conf":"known"},{"n":87,"title":"Ultima IV","year":85,"publisher":"Origin","category":"RPG","archetype":"tile RPG (disk world)","needs":["graphics-loading"],"diff":"XL","conf":"known"},{"n":88,"title":"Ultima V","year":88,"publisher":"Origin","category":"RPG","archetype":"tile RPG (disk world)","needs":["graphics-loading"],"diff":"XL","conf":"known"},{"n":89,"title":"The Bard's Tale","year":85,"publisher":"EA","category":"RPG","archetype":"dungeon RPG (disk)","needs":["graphics-loading"],"diff":"XL","conf":"known"},{"n":90,"title":"Pool of Radiance","year":88,"publisher":"SSI","category":"RPG","archetype":"tactical RPG (disk)","needs":["graphics-loading"],"diff":"XL","conf":"inferred"},{"n":91,"title":"Times of Lore","year":88,"publisher":"Origin","category":"RPG","archetype":"action-RPG scroll (disk)","needs":["optimizer","graphics-loading"],"diff":"XL","conf":"inferred"},{"n":92,"title":"Pirates!","year":87,"publisher":"MicroProse","category":"Adventure","archetype":"multi-mode sim (disk)","needs":["graphics-loading"],"diff":"XL","conf":"known"},{"n":93,"title":"Elite","year":85,"publisher":"Firebird","category":"Sim/3D","archetype":"real-time vector-3D","needs":["math","asm"],"diff":"XL","conf":"known"},{"n":94,"title":"Mercenary","year":86,"publisher":"Novagen","category":"Sim/3D","archetype":"filled-vector 3D world","needs":["math","asm"],"diff":"XL","conf":"inferred"},{"n":95,"title":"M.U.L.E.","year":83,"publisher":"EA","category":"Strategy","archetype":"board + real-time auction","needs":[],"diff":"M","conf":"known"},{"n":96,"title":"Archon","year":83,"publisher":"EA","category":"Strategy","archetype":"board + arcade combat","needs":[],"diff":"L","conf":"inferred"},{"n":97,"title":"Laser Squad","year":88,"publisher":"Blade","category":"Strategy","archetype":"turn-based tactics","needs":[],"diff":"L","conf":"inferred"},{"n":98,"title":"Sim City","year":89,"publisher":"Maxis","category":"Sim","archetype":"city simulation","needs":["graphics-loading"],"diff":"L","conf":"inferred"},{"n":99,"title":"Lords of Midnight","year":84,"publisher":"Beyond","category":"Strategy","archetype":"strategy + vector views","needs":["graphics-loading"],"diff":"L","conf":"inferred"},{"n":100,"title":"Little Computer People","year":85,"publisher":"Activision","category":"Sim","archetype":"single-house sim","needs":[],"diff":"M","conf":"inferred"}],"inversion":{"intro":"What shipping each capability unlocks — the number of the 100 titles that list it in their **Needs**. Read this to decide what to build next.","rows":[{"id":"optimizer","impact":"**The single biggest unlock.** Moves nearly every perf-bound scroller, shmup and brawler from Blocked/Soon toward Now. Already planned."},{"id":"graphics-loading","impact":"**The biggest hard-gap unlock.** Frees the entire disk catalogue — the RPGs (Ultima, Bard’s Tale, Pool of Radiance), SCUMM adventures, Cinemaware, Epyx multi-event sports, and the streamed Last Ninjas. No story exists today."},{"id":"asm","impact":"The 50 fps / vector ceiling the optimizer alone can’t reach: real-time 3D (Elite, Mercenary), sprite-scaling racers (Out Run), the full-colour scroll showcase (Mayhem in Monsterland)."},{"id":"math","impact":"Fractional physics: golf (Leaderboard), marble/ball physics (Marble Madness, Spindizzy), pseudo-3D road math. Hand-rollable today (why several are Soon, not Blocked); a library makes them clean."},{"id":"sound-sampled","impact":"Digitized speech (Impossible Mission-class). Doable in-language with tight timing; an effort, not a language gap."},{"id":"indirect-calls","impact":"True VM / dispatch-table engines (SCUMM). Also the clean way to call a ripped `.sid` player and any jump-table dispatch — a broad quality-of-life unlock beyond the raw count."}],"bottomLine":"**Sequencing:** the **optimizer** first (planned; unlocks the most and the flashiest arcade action), then a **graphics-loading / disk** story (frees the entire \"epic\" catalogue the optimizer can never touch), then **hand-tuned asm** + a **fixed-point math** library for the 3D / showcase tier."},"provenance":["**The list is curated, not a sourced ranking.** These are 100 well-known, category-spanning C64 titles — not \"the top 100\" by any measured metric (sales, Zzap!64 score, Lemon64 votes). Swap freely with `/update_capability`.","**Verdicts anchor on *engine archetype*, the real feasibility driver**, then adjust for a title’s specifics. Where a title’s internals are inferred rather than known, the **Conf** column says so (⚠️/🔴) — treat those rows as archetype estimates, not reverse-engineered fact.","**Faithfulness bar is strict**: \"Now\" means the original *as played*. A reduced-scope demake that captures the feel but drops the smooth scroll, the multiplexed sprite count, the disk-streamed content, or the exact soundtrack is not \"Now\" — even when it would be a perfectly good game.","**Memory pressure is folded into difficulty, not a capability.** A title that strains 64 KB but fits with effort is not \"blocked\"; one whose data genuinely exceeds RAM needs *graphics loading* (disk), and is marked so."],"footer":"Maintained via `/update_capability`. When a capability ships (the optimizer lands, a disk / loader story arrives, fixed-point math or asm-linking ships), re-run it to move every game waiting on that capability and refresh the counts.","derived":{"total":100,"summary":{"now":31,"soon":38,"blocked":31},"unlock":{"compiler":0,"optimizer":47,"sound-music":0,"sound-sampled":3,"joystick":0,"graphics-loading":17,"math":14,"asm":14,"indirect-calls":2},"categories":["Maze","Action","Platform","Shooter","Puzzle","Adventure","Fighting","Beat-em-up","Sports","Racing","RPG","Sim/3D","Strategy","Sim"]}}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("matrix-data").textContent);
const G = DATA.games;
const D = DATA.derived;
const CAP = Object.fromEntries(DATA.capabilities.map(c => [c.id, c]));
const TIER = Object.fromEntries(DATA.tiers.map(t => [t.id, t]));
const VMAP = Object.fromEntries(DATA.verdicts.map(v => [v.id, v]));
const CMAP = Object.fromEntries(DATA.scales.confidence.map(c => [c.key, c]));
const VORDER = Object.fromEntries(DATA.verdicts.map((v,i) => [v.id, i]));
const CORDER = Object.fromEntries(DATA.scales.confidence.map((c,i) => [c.key, i]));
const DORDER = Object.fromEntries(DATA.scales.diff.map((d,i) => [d, i]));
const TORDER = Object.fromEntries(DATA.tiers.map((t,i) => [t.id, i]));

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(s){
  return esc(s)
    .replace(/`([^`]+)`/g, (_,c)=>"<code>"+c+"</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" rel="noopener">$1</a>');
}
// a game's verdict is derived from its needs + capability tiers
function verdictOf(g){
  if(!g.needs.length) return "now";
  return g.needs.some(c => CAP[c].tier==="unplanned") ? "blocked" : "soon";
}
// needs sorted most-blocking first (unplanned before planned)
function sortedNeeds(g){
  return [...g.needs].sort((a,b)=> TORDER[CAP[b].tier]-TORDER[CAP[a].tier]);
}
const statusOfTier = id => TIER[id].status;

const state = { q:"", cat:"all", verdicts:new Set(), caps:new Set(), sort:{key:"n", dir:1} };

function passes(g){
  if(state.cat!=="all" && g.category!==state.cat) return false;
  if(state.verdicts.size && !state.verdicts.has(verdictOf(g))) return false;
  if(state.caps.size && ![...state.caps].some(c => g.needs.includes(c))) return false;
  if(state.q){
    const hay = (g.title+" "+(g.publisher||"")+" "+g.category+" "+g.archetype+" "+
                 g.needs.map(c=>CAP[c].name).join(" ")).toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}
function cmp(a,b){
  const k=state.sort.key; let x,y;
  if(k==="verdict"){x=VORDER[verdictOf(a)];y=VORDER[verdictOf(b)];}
  else if(k==="conf"){x=CORDER[a.conf];y=CORDER[b.conf];}
  else if(k==="diff"){x=DORDER[a.diff];y=DORDER[b.diff];}
  else if(k==="n"){x=a.n;y=b.n;}
  else if(k==="needs"){x=a.needs.length;y=b.needs.length;}
  else {x=String(a[k]).toLowerCase();y=String(b[k]).toLowerCase();}
  if(x<y) return -state.sort.dir; if(x>y) return state.sort.dir; return a.n-b.n;
}

function verdictCell(g){
  const v=VMAP[verdictOf(g)];
  return '<span class="verd '+v.status+'" title="'+esc(v.desc)+'">'+v.glyph+" "+esc(v.label)+"</span>";
}
function needsCell(g){
  if(!g.needs.length) return '<span class="dash">—</span>';
  return sortedNeeds(g).map(id=>{
    const c=CAP[id], on=state.caps.has(id)?" on":"";
    return '<span class="needchip'+on+'" data-cap="'+id+'" title="'+esc(TIER[c.tier].label)+'">'+
           '<span class="tdot '+statusOfTier(c.tier)+'"></span>'+esc(c.name)+"</span>";
  }).join("");
}
function rowHtml(g){
  const pub=g.publisher?", "+g.publisher:"";
  const c=CMAP[g.conf];
  return "<tr>"+
    '<td class="num">'+g.n+"</td>"+
    "<td><span class=gtitle>"+esc(g.title)+'</span> <span class=gmeta>('+g.year+esc(pub)+")</span></td>"+
    "<td>"+esc(g.category)+"</td>"+
    '<td class="arch">'+esc(g.archetype)+"</td>"+
    '<td class="c">'+verdictCell(g)+"</td>"+
    "<td>"+needsCell(g)+"</td>"+
    '<td class="c diff">'+g.diff+"</td>"+
    '<td class="conf"><span class="cdot '+g.conf+'"></span>'+esc(c.label)+"</td>"+
    "</tr>";
}
function renderTable(){
  const rows=G.filter(passes).sort(cmp);
  const body=document.getElementById("tbody");
  body.innerHTML = rows.length
    ? rows.map(rowHtml).join("")
    : '<tr><td class="empty" colspan="8">No games match these filters.</td></tr>';
  document.getElementById("count").textContent="Showing "+rows.length+" of "+D.total;
  document.querySelectorAll("th button[data-key]").forEach(b=>{
    const a=b.querySelector(".arw"); if(a) a.textContent = b.dataset.key===state.sort.key ? (state.sort.dir>0?"▲":"▼") : "";
  });
  syncCapChips();
}

function bars(){
  const mk=(label,id)=>{
    const n=D.summary[id]||0, total=D.total;
    const seg='<span class="seg '+VMAP[id].status+'" style="flex:'+n+'" title="'+
      esc(VMAP[id].label)+': '+n+'">'+(n>=4?n:"")+"</span>";
    return {n,seg};
  };
  const segs=DATA.verdicts.map(v=>mk(v.label,v.id).seg).join("");
  const leg=DATA.verdicts.map(v=>'<span><span class="dot '+v.status+'"></span><b>'+v.glyph+" "+
    esc(v.label)+"</b> — "+esc(v.desc)+"</span>").join("");
  return '<div class="bars"><div class="bar-row"><div class="bar-lab">Buildable</div>'+
    '<div class="bar">'+segs+'</div></div><div class="legend-row">'+leg+"</div></div>";
}

function board(){
  const groups=DATA.tiers.map(t=>{
    const caps=DATA.capabilities.filter(c=>c.tier===t.id);
    const chips=caps.map(c=>{
      const cnt=D.unlock[c.id]||0, on=state.caps.has(c.id)?" on":"";
      return '<span class="capchip t-'+t.id+on+'" data-cap="'+c.id+'" title="'+esc(c.blurb)+'">'+
        '<span class="tdot '+t.status+'"></span>'+esc(c.name)+
        '<span class="n">'+cnt+"</span></span>";
    }).join("");
    return '<div class="tiergroup"><div class="tiername">'+t.glyph+" "+esc(t.label)+
      "<small>"+(t.id==="available"?"games blocked on it":"games waiting")+"</small></div>"+
      '<div class="capchips">'+chips+"</div></div>";
  }).join("");
  return '<div class="board">'+groups+"</div>";
}

function controls(){
  const cats=['<option value="all">All categories</option>']
    .concat(D.categories.map(c=>'<option value="'+esc(c)+'">'+esc(c)+"</option>")).join("");
  const vchips=DATA.verdicts.map(v=>
    '<button class="chip v '+v.status+'" data-verdict="'+v.id+'">'+v.glyph+" "+esc(v.label)+"</button>").join("");
  return '<div class="controls">'+
    '<input type="search" id="q" placeholder="Search game, archetype…" aria-label="Search">'+
    '<select id="cat" aria-label="Category filter">'+cats+"</select>"+
    '<span class="filtlabel">buildable</span>'+vchips+
    '<button class="reset" id="reset">Reset</button>'+
    '<span class="count" id="count"></span></div>';
}

function refTables(){
  const capRows=DATA.capabilities.map(c=>
    "<tr><td><strong>"+esc(c.name)+'</strong></td><td><span class="tdot '+TIER[c.tier].status+
    '" style="display:inline-block;margin-right:6px"></span>'+esc(TIER[c.tier].label)+
    '</td><td class="c diff">'+(D.unlock[c.id]||0)+"</td><td>"+md(c.blurb)+"</td></tr>").join("");
  const inv=DATA.inversion.rows.map(r=>{
    const c=CAP[r.id];
    return "<tr><td><strong>"+esc(c.name)+'</strong></td><td class="c diff">'+(D.unlock[r.id]||0)+
      "</td><td>"+md(r.impact)+"</td></tr>";
  }).join("");
  const howto=DATA.howToRead.map(x=>"<li>"+md(x)+"</li>").join("");
  const notes=DATA.notes.map(x=>"<li>"+md(x)+"</li>").join("");
  const prov=DATA.provenance.map(x=>"<li>"+md(x)+"</li>").join("");

  return '<h2>Reference</h2>'+
    "<details open><summary>Prioritization — what shipping each capability unlocks</summary>"+
      "<p>"+md(DATA.inversion.intro)+"</p>"+
      '<table class="ref"><thead><tr><th>Capability</th><th class="c">Titles</th><th>Impact</th></tr></thead><tbody>'+inv+"</tbody></table>"+
      "<p>"+md(DATA.inversion.bottomLine)+"</p></details>"+
    "<details><summary>Capability details</summary>"+
      '<table class="ref"><thead><tr><th>Capability</th><th>Status</th><th class="c">Waiting</th><th>What it is</th></tr></thead><tbody>'+capRows+"</tbody></table></details>"+
    "<details><summary>How to read this</summary><ul class=notes>"+howto+"</ul>"+
      "<ul class=notes>"+notes+"</ul></details>"+
    "<details><summary>Provenance &amp; confidence caveats</summary><ul class=notes>"+prov+"</ul></details>";
}

function render(){
  const app=document.getElementById("app");
  const purpose=DATA.intro.purpose.map(p=>"<p class=purpose>"+md(p)+"</p>").join("");
  app.innerHTML=
    '<div class="topbar"><div><h1>'+esc(DATA.meta.title)+"</h1>"+
      '<p class="sub">Last updated '+esc(DATA.meta.lastUpdated)+
      " · refresh with <code>"+esc(DATA.meta.refreshWith)+"</code></p></div>"+
      '<button class="themebtn" id="theme">◐ Theme</button></div>'+
    purpose+
    '<h2>At a glance</h2>'+bars()+
    '<h2>Capability status <span class="gmeta">— the lever: ship one, everything waiting on it moves</span></h2>'+board()+
    '<h2>The matrix</h2>'+controls()+
    '<div class="tablewrap"><table>'+refHead()+'<tbody id="tbody"></tbody></table></div>'+
    refTables()+
    '<p class="foot">'+md(DATA.footer)+"</p>";
  app.removeAttribute("aria-busy");
  wire();
  renderTable();
}
function refHead(){
  const cols=[["n","#",1],["title","Game"],["category","Cat"],["archetype","Archetype"],
    ["verdict","Buildable?",1],["needs","Needs",1],["diff","Diff",1],["conf","Conf",1]];
  return "<thead><tr>"+cols.map(([k,l,c])=>
    '<th class="'+(c?"c":"")+'"><button data-key="'+k+'">'+esc(l)+' <span class="arw"></span></button></th>').join("")+"</tr></thead>";
}

function wire(){
  document.getElementById("q").addEventListener("input", e=>{state.q=e.target.value.trim().toLowerCase();renderTable();});
  document.getElementById("cat").addEventListener("change", e=>{state.cat=e.target.value;renderTable();});
  document.getElementById("reset").addEventListener("click", ()=>{
    state.q="";state.cat="all";state.verdicts.clear();state.caps.clear();
    document.getElementById("q").value="";document.getElementById("cat").value="all";
    syncVerdictChips();refreshBarsBoard();renderTable();
  });
  document.querySelectorAll("[data-verdict]").forEach(b=>b.addEventListener("click", ()=>{
    toggle(state.verdicts,b.dataset.verdict);syncVerdictChips();renderTable();
  }));
  document.querySelectorAll("th button[data-key]").forEach(b=>b.addEventListener("click", ()=>{
    const k=b.dataset.key;
    if(state.sort.key===k) state.sort.dir*=-1; else state.sort={key:k,dir:1};
    renderTable();
  }));
  // capability toggles come from the board and from Needs chips in rows
  document.addEventListener("click", e=>{
    const el=e.target.closest("[data-cap]"); if(!el) return;
    if(el.classList.contains("t-available")) return; // available caps have nothing waiting
    toggle(state.caps, el.dataset.cap); syncCapChips(); renderTable();
  });
  document.getElementById("theme").addEventListener("click", toggleTheme);
}
function toggle(set,v){ set.has(v)?set.delete(v):set.add(v); }
function syncVerdictChips(){
  document.querySelectorAll("[data-verdict]").forEach(b=>b.classList.toggle("on", state.verdicts.has(b.dataset.verdict)));
}
function syncCapChips(){
  document.querySelectorAll("[data-cap]").forEach(el=>el.classList.toggle("on", state.caps.has(el.dataset.cap)));
}
function refreshBarsBoard(){
  document.querySelector(".bars").outerHTML=bars();
  document.querySelector(".board").outerHTML=board();
}
function toggleTheme(){
  const root=document.documentElement;
  const dark=root.getAttribute("data-theme")==="dark" ||
    (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
  root.setAttribute("data-theme", dark?"light":"dark");
}
render();
</script>
</body>
</html>
