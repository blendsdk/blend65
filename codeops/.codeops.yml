# CodeOps layout marker. Presence of this file opts the repo into the nested layout.
# Sole writer: setup-codeops. Schema: _shared/layout-convention.md
codeopsLayout: nested
layoutVersion: "3.0.0"
integrationBranch: v3 # Explicit project integration branch; analyze-project reads, never writes this marker.
conventions:
  rdIdScope: per-feature
  taskIdPrefix: "T"
  maintenanceFeature: _maintenance
  archiveDir: codeops/_archive
